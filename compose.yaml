services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: finscope
      POSTGRES_USER: finscope
      POSTGRES_PASSWORD: finscope
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "finscope", "-d", "finscope"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
